name: Release

on:
  # Pre-release: a push to a pre-release-* branch — a test build, not merged.
  push:
    branches: ["pre-release-*"]
  # Stable: the merge of a release-* PR — tagged on the merge commit on main.
  pull_request:
    types: [closed]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: sh

jobs:
  release:
    if: >-
      github.event_name == 'push'
      || (github.event.pull_request.merged == true
          && startsWith(github.event.pull_request.head.ref, 'release-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Stable cuts tag the PR merge commit on main; pre-releases build
          # from the pushed branch tip. Full history + tags so stable notes
          # can anchor to the previous stable tag.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - uses: extractions/setup-just@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install the project
        run: uv sync --frozen

      - uses: oven-sh/setup-bun@v2

      - name: Install node deps
        run: bun install --frozen-lockfile

      - name: Resolve version
        id: version
        run: |
          VERSION=$(just --evaluate current_version)
          IS_DEV=$(just --evaluate is_dev)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "IS_DEV=$IS_DEV" >> "$GITHUB_OUTPUT"

      - name: Check event matches version
        env:
          IS_DEV: ${{ steps.version.outputs.IS_DEV }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "$IS_DEV" != "true" ]; then
            echo "::error::Stable version on a pre-release-* branch; cut stable via a release-* PR"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$IS_DEV" = "true" ]; then
            echo "::error::Dev version in a release-* PR; cut pre-releases from a pre-release-* branch"
            exit 1
          fi

      - name: Build
        run: just build

      - name: Check for existing GitHub release
        id: github-release
        env:
          TAG_NAME: "v${{ steps.version.outputs.VERSION }}"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub prerelease draft
        if: >-
          steps.github-release.outputs.exists == 'false'
          && steps.version.outputs.IS_DEV == 'true'
        env:
          TAG_NAME: "v${{ steps.version.outputs.VERSION }}"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: >-
          gh release create "$TAG_NAME"
          --draft
          --prerelease
          --generate-notes
          --target "$TARGET_SHA"
          dist/*

      - name: Create GitHub stable release draft
        if: >-
          steps.github-release.outputs.exists == 'false'
          && steps.version.outputs.IS_DEV == 'false'
        env:
          TAG_NAME: "v${{ steps.version.outputs.VERSION }}"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: >-
          gh release create "$TAG_NAME"
          --draft
          --generate-notes
          --target "$TARGET_SHA"
          dist/*

      - name: Check GitHub release metadata
        env:
          TAG_NAME: "v${{ steps.version.outputs.VERSION }}"
          IS_DEV: ${{ steps.version.outputs.IS_DEV }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          ACTUAL_TARGET=$(gh release view "$TAG_NAME" \
            --json targetCommitish \
            --jq '.targetCommitish')
          if [ "$ACTUAL_TARGET" != "$TARGET_SHA" ]; then
            echo "::error::Release $TAG_NAME targets $ACTUAL_TARGET; expected $TARGET_SHA"
            exit 1
          fi

          ACTUAL_PRERELEASE=$(gh release view "$TAG_NAME" \
            --json isPrerelease \
            --jq '.isPrerelease')
          if [ "$ACTUAL_PRERELEASE" != "$IS_DEV" ]; then
            echo "::error::Release $TAG_NAME prerelease state is $ACTUAL_PRERELEASE; expected $IS_DEV"
            exit 1
          fi

      - name: Check GitHub release assets
        env:
          TAG_NAME: "v${{ steps.version.outputs.VERSION }}"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG_NAME" --json assets \
            --jq '.assets[] | "\(.digest)  dist/\(.name)"' \
            | sed 's/^sha256://' \
            | sort > "$RUNNER_TEMP/remote-assets.sha256"
          sha256sum dist/* \
            | sort > "$RUNNER_TEMP/local-assets.sha256"
          diff -u \
            "$RUNNER_TEMP/remote-assets.sha256" \
            "$RUNNER_TEMP/local-assets.sha256"

      - name: Publish to PyPI
        # Publish core (rbtr-*) and every language plugin (rbtr_lang_*).
        # rbtr-eval is internal (Private :: Do Not Upload) and is excluded by
        # these globs; the classifier is the belt-and-braces guarantee.
        run: >-
          uv publish
          --check-url https://pypi.org/simple
          dist/rbtr-*.whl
          dist/rbtr_lang_*.whl
          dist/rbtr-*.tar.gz
          dist/rbtr_lang_*.tar.gz

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish Pi extension to npm
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          NPM_TAG: ${{ steps.version.outputs.IS_DEV == 'true' && 'next' || 'latest' }}
        run: |
          PACKAGE="@janrito/pi-rbtr"
          TARBALL="./dist/janrito-pi-rbtr-$VERSION.tgz"
          npm publish "$TARBALL" --access public --tag "$NPM_TAG" \
            || [ "$(npm view "$PACKAGE@$VERSION" dist.integrity)" = \
              "$(npm pack "$TARBALL" --dry-run --json | jq -er '.[0].integrity')" ]

      - name: Publish review skill to npm
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          NPM_TAG: ${{ steps.version.outputs.IS_DEV == 'true' && 'next' || 'latest' }}
        run: |
          PACKAGE="@janrito/skill-rbtr-review-github-pr"
          TARBALL="./dist/janrito-skill-rbtr-review-github-pr-$VERSION.tgz"
          npm publish "$TARBALL" --access public --tag "$NPM_TAG" \
            || [ "$(npm view "$PACKAGE@$VERSION" dist.integrity)" = \
              "$(npm pack "$TARBALL" --dry-run --json | jq -er '.[0].integrity')" ]

      - name: Publish GitHub release
        env:
          TAG_NAME: "v${{ steps.version.outputs.VERSION }}"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG_NAME" --draft=false
